<!DOCTYPE html>
<!-- saved from url=(0045)https://s.auto.itc.cn/pensieve/hub/index.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hub page</title>
  </head>

  <body>
    <script>
      var map = {
        setItem: function (key, value) {
          window.localStorage["setItem"](key, value);
        },
        getItem: function (key) {
          return window.localStorage["getItem"](key);
        },
      };

      // “中转页面”监听 ifameWin.postMessage() 事件
      window.addEventListener("message", function (e) {
        var response;
        if (typeof e.data === "string") {
          response = "end";
        } else {
          var method = e.data.method;
          var key = e.data.key;
          var value = e.data.value;
          // 处理对应的存储方法
          if (method == "getItem" || method == "setItem") {
            var result = map[method](key, value);
            response = {
              result,
            };
            // 返回给当前 client 的数据
            response = {
              [e.data.key]: map["getItem"](key),
            };
          }
        }
        // 把获取的数据，传递给 client
        window.parent.postMessage(response, "*");
      });
      console.log("hub iframe loaded");
    </script>
  

</body></html>
